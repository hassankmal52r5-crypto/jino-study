<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jino Study - Semester 1</title>
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jino Study">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
 --bg:#eef0fb; --card:#ffffff; --ink:#1e1b4b; --muted:#6b7280;
 --blue:#2563eb; --purple:#7c3aed; --grad:linear-gradient(135deg,#2563eb,#7c3aed);
 --ok:#16a34a; --bad:#dc2626; --line:#e5e7eb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:var(--grad);color:#fff;padding:18px 16px 22px;border-radius:0 0 24px 24px;box-shadow:0 6px 24px rgba(80,60,220,.25)}
header h1{margin:0;font-size:22px}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
header p{margin:4px 0 0;opacity:.85;font-size:13px}
.tourbtn{flex-shrink:0;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;margin-left:6px}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(30,27,75,.06)}
.subj{cursor:pointer;display:block;width:100%;text-align:left;border:0}
.subj h2{margin:0 0 2px;font-size:18px}
.subj .lec{color:var(--muted);font-size:13px;margin-bottom:10px}
.bar{height:9px;background:#ececf6;border-radius:99px;overflow:hidden}
.bar div{height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
.pct{font-size:12px;color:var(--muted);margin-top:6px}
.tabs{display:flex;gap:6px;margin:14px 0;position:sticky;top:8px;z-index:5}
.tabs button{flex:1;border:0;background:#fff;color:var(--muted);border-radius:12px;padding:9px 2px;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(30,27,75,.08);cursor:pointer}
.tabs button.on{background:var(--grad);color:#fff}
.back{background:none;border:0;color:#fff;font-size:14px;font-weight:700;padding:0 0 8px;cursor:pointer;opacity:.9}
.sec h3{margin:0;font-size:17px;color:var(--purple);flex:1}
.sechead{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.sec-ar-title{width:100%;font-size:13px;color:var(--muted);direction:rtl;text-align:right;display:none;margin:2px 0 0}
.show-ar .sec-ar-title{display:block}
.langbtn{width:54px;height:30px;border-radius:99px;border:2px solid var(--purple);background:#fff;position:relative;cursor:pointer;padding:0;flex-shrink:0;transition:background .18s ease}
.langbtn .knob{position:absolute;top:1px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--grad);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:left .18s ease;font-family:inherit}
.langbtn.on{background:var(--purple)}
.langbtn.on .knob{left:24px;background:#fff;color:var(--purple)}
.sec p,.sec li{font-size:15px;line-height:1.65}
.sec ul{padding-left:20px}
.blk .arb{display:none;direction:rtl;text-align:right;background:#f5f3ff;border-radius:10px;padding:8px 12px;margin:4px 0 10px;font-size:14.5px;line-height:1.7;border-right:3px solid var(--purple)}
.show-ar .blk .arb{display:block}
.blk .arb ul{padding-right:20px;padding-left:0}
.note{background:#fef3c7;border-radius:10px;padding:10px 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.termdef{background:#eef2ff;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px;border-right:3px solid var(--purple);width:100%}
.termdef .ar{display:block;direction:rtl;text-align:right;margin-top:4px;color:#4c1d95}
.readbtn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.readbtn.done{border-color:var(--ok);color:var(--ok);background:#f0fdf4}
.btn{display:block;width:100%;border:0;background:var(--grad);color:#fff;border-radius:14px;padding:14px;font-size:15px;font-weight:800;margin-top:12px;cursor:pointer;box-shadow:0 4px 14px rgba(80,60,220,.3)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.row{display:flex;justify-content:space-between;gap:4%}
/* figures */
.svgfig{margin:14px 0 4px;background:#fbfbff;border:1px solid var(--line);border-radius:12px;padding:8px}
.svgfig svg{width:100%;height:auto;display:block}
.viewer{margin:14px 0 4px;background:linear-gradient(160deg,#17123a,#2a1e63);border-radius:12px;overflow:hidden;position:relative}
.viewer .vtitle{color:#c7d2fe;font-size:12px;font-weight:700;padding:8px 12px 0}
.viewer .vhint{color:#8b8bb0;font-size:10.5px;padding:0 12px 6px}
.viewer canvas{display:block;width:100%;height:270px;touch-action:none;cursor:grab}
.figcap{font-size:12px;color:var(--muted);margin:6px 2px 0;text-align:center;line-height:1.5}
/* flashcards */
.flash{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative}
.flash .inner{font-size:17px;font-weight:700;line-height:1.6;padding:8px;width:100%}
.flash .backface{font-weight:500;font-size:15px}
.flash .hint{position:absolute;bottom:10px;left:0;right:0;font-size:11px;color:var(--muted)}
.fnav{display:flex;gap:8px;margin-top:12px}
.fnav button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:14px;cursor:pointer}
.fnav .no{background:#fee2e2;color:var(--bad)}
.fnav .yes{background:#dcfce7;color:var(--ok)}
/* quiz */
.q{font-size:16px;font-weight:800;line-height:1.5;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:#f8f7ff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:14.5px;cursor:pointer;line-height:1.45}
.opt.ok{border-color:var(--ok);background:#f0fdf4}
.opt.bad{border-color:var(--bad);background:#fef2f2}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px;font-size:14px;margin-top:10px;line-height:1.6}
.fb.ok{background:#f0fdf4;border:1px solid #bbf7d0}
.fb.bad{background:#fef2f2;border:1px solid #fecaca}
.fb .ar{display:block;direction:rtl;text-align:right;margin-top:6px;color:#57534e}
.prog{font-size:12px;color:var(--muted);margin-bottom:8px}
.score-big{font-size:46px;font-weight:900;text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.center{text-align:center}
.missed{text-align:left;font-size:13.5px;background:#fafafa;border-radius:10px;padding:10px 12px;margin:8px 0;border-right:3px solid var(--bad)}
.model{background:#f8f7ff;border-radius:12px;padding:12px;font-size:14.5px;line-height:1.6;margin-top:10px}
.prow{display:flex;align-items:center;gap:10px;margin:10px 0}
.prow .lbl{flex:1;font-size:14px;font-weight:600}
.prow .bar{flex:2}
.prow .val{width:56px;text-align:left;font-size:12px;color:var(--muted)}
.stat-grid{display:flex;gap:10px;margin:10px 0}
.stat-grid .s{flex:1;background:#f8f7ff;border-radius:14px;padding:12px;text-align:center}
.stat-grid .s b{display:block;font-size:20px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-grid .s span{font-size:11px;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.footer-note{text-align:center;font-size:11px;color:var(--muted);margin-top:22px;line-height:1.7}
/* translation popup */
#pop{position:fixed;z-index:70;max-width:320px;background:#1e1b4b;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none;font-size:14px;line-height:1.6}
#pop .par{direction:rtl;text-align:right;font-size:15px;font-weight:700;color:#e9d5ff}
#pop .pen{font-size:12.5px;color:#c4b5fd;margin-top:4px}
#pop .prow2{display:flex;gap:8px;margin-top:8px}
#pop button{flex:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:7px;font-size:12.5px;font-weight:700;cursor:pointer}
#pop .none{color:#fca5a5}
/* plan */
.weekrow{display:flex;gap:5px;overflow-x:auto;margin:10px 0 4px;padding-bottom:2px}
.weekrow button{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}
.weekrow button.on{border-color:var(--purple);color:var(--purple);background:#f5f3ff}
.daycol{background:#fbfbff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:9px 0}
.daycol .dh{display:flex;align-items:center;justify-content:space-between}
.daycol .dh b{font-size:14px}
.daycol .dh .today{font-size:10.5px;background:var(--grad);color:#fff;border-radius:99px;padding:3px 9px;font-weight:800}
.sess{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin:8px 0}
.sess .dot{width:9px;height:9px;border-radius:50%;background:var(--grad);flex-shrink:0}
.sess .si{flex:1;font-size:13px;line-height:1.4}
.sess .si small{display:block;color:var(--muted);font-size:11px}
.sess.done .si{text-decoration:line-through;opacity:.55}
.sess button{border:0;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:800;cursor:pointer}
.sess .chk{background:#dcfce7;color:var(--ok)}
.sess.done .chk{background:#e5e7eb;color:var(--muted)}
.sess .del{background:#fee2e2;color:var(--bad)}
.addbox{background:#f5f3ff;border:1.5px dashed #c7d2fe;border-radius:12px;padding:10px;margin:8px 0}
.addbox select{width:100%;padding:9px;border-radius:9px;border:1.5px solid #c7d2fe;font:inherit;font-size:13.5px;margin:5px 0;background:#fff}
/* tour */
#tourbg{position:fixed;inset:0;background:rgba(15,10,40,.72);z-index:80;display:none}
#tourhl{position:fixed;z-index:81;border:3px solid #fbbf24;border-radius:14px;box-shadow:0 0 0 4000px rgba(15,10,40,.55),0 0 24px #fbbf24;display:none;pointer-events:none}
#tourcard{position:fixed;z-index:82;left:16px;right:16px;background:#fff;border-radius:16px;padding:16px;display:none;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#tourcard .tt{direction:rtl;text-align:right;font-size:14.5px;line-height:1.7;color:var(--ink)}
#tourcard .tn{display:flex;gap:8px;margin-top:12px}
#tourcard .tn button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:800;font-size:13.5px;cursor:pointer}
#tourcard .next{background:var(--grad);color:#fff}
#tourcard .skip{background:#f3f4f6;color:var(--muted)}
#tourcard .tcount{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
</style>
</head>
<body>
<header id="hdr"></header>
<div class="wrap" id="app"></div>
<div id="pop"></div>
<div id="tourbg"></div><div id="tourhl"></div>
<div id="tourcard"><div class="tt" id="tourtext"></div><div class="tn"><button class="skip" onclick="tourEnd()">تخطي</button><button class="next" id="tournext" onclick="tourNext()">التالي</button></div><div class="tcount" id="tourcount"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const LECTURES = {"ct": ["Introduction to CT physics", "CT generations", "CT components: operation 1", "CT components: operation 2", "CT components: operation 3", "Image processing and display 1", "Image processing and display 2", "Image quality 1", "Image quality 2", "Radiation protection practices", "Advanced CT 1", "Advanced CT scanning 2"], "bio": ["Introduction to Radiobiology", "Lecture 2", "Lecture 3", "Lecture 4", "Lecture 5", "Lecture 6", "Lecture 7", "Lecture 8", "Lecture 9", "Lecture 10", "Lecture 11", "Lecture 12", "Lecture 13", "Lecture 14"]};
const DATA = {"ct": {"name": "Basic CT Radiography", "lec": "Lecture 1 - Introduction to CT physics", "short": "CT", "sections": [{"id": "ct1", "title_en": "What is CT?", "title_ar": "ما هو الـ CT؟", "figs": ["brain3d"], "blocks": [{"en": "<p><b>Tomography</b> comes from Greek: <b>tomo</b> = cross-section, layer, cut, and <b>graph</b> = something written or drawn. So tomography means recording a slice.</p>", "ar": "<p>كلمة <b>Tomography</b> جاية من اليوناني: <b>tomo</b> يعني مقطع أو شريحة، و<b>graph</b> يعني حاجة مكتوبة أو مرسومة. يعني توموجرافي = تسجيل شريحة.</p>"}, {"en": "<p>In 1937, making transverse x-ray cross-sections was called <b>Transverse Axial Tomography (TAT)</b>. After a digital computer was used to process the final images it was renamed <b>CAT</b> (computerized axial tomography), then abbreviated to <b>CT</b>. Other names you may meet: <b>CTAT</b> (computerized transaxial tomography) and <b>DAT</b> (digital axial tomography).</p>", "ar": "<p>سنة 1937، عمل مقاطع سينية مستعرضة كان اسمه <b>Transverse Axial Tomography (TAT)</b>. بعد ما الكمبيوتر الرقمي اتستخدم في معالجة الصور النهائية اتسمى <b>CAT</b>، وبعدين اختصر لـ <b>CT</b>. أسماء تانية ممكن تقابلها: <b>CTAT</b> و<b>DAT</b>.</p>"}, {"en": "<p><b>Definition:</b> computed tomography is the science that creates <b>two-dimensional cross-sectional images</b> from <b>three-dimensional body structures</b>. The 2D images can be reconstructed into different viewing modes.</p>", "ar": "<p><b>التعريف:</b> الـ CT هو العلم اللي بيعمل <b>صور مقطعية ثنائية الأبعاد</b> من <b>تراكيب الجسم الثلاثية الأبعاد</b>. والصور ثنائية الأبعاد ممكن يعاد بناؤها لأوضاع عرض مختلفة.</p>"}], "terms": [["tomography", "Greek: tomo = cross-section/layer/cut, graph = something written or drawn.", "توموجرافي: تسجيل شريحة أو مقطع من الجسم."], ["TAT", "Transverse Axial Tomography, 1937: transverse x-ray image cross-sections.", "التصوير المقطعي المحوري المستعرض، 1937."], ["CAT", "Computerized Axial Tomography: TAT after a digital computer processed the images.", "التصوير المقطعي المحوري بالحاسوب."], ["cross-sectional image", "A 2D slice view of a 3D body structure.", "صورة شريحة ثنائية الأبعاد لتركيب ثلاثي الأبعاد."]]}, {"id": "ct2", "title_en": "History of CT", "title_ar": "تاريخ الـ CT", "figs": ["svg_timeline"], "blocks": [{"en": "<p><b>1963:</b> <b>Alan Cormack</b>, a medical physicist, developed a mathematical method of reconstructing images from x-ray projections.</p>", "ar": "<p><b>1963:</b> <b>آلان كورماك</b>، فيزيائي طبي، طور طريقة رياضية لإعادة بناء الصور من إسقاطات الأشعة السينية.</p>"}, {"en": "<p><b>1971:</b> <b>Godfrey Hounsfield</b>, an engineer at the Central Research Laboratories of EMI Ltd in England, developed the <b>first clinically useful CT scanner</b>. The first clinical head scanner was installed at Atkinson-Morley Hospital in Wimbledon, England.</p>", "ar": "<p><b>1971:</b> <b>جودفري هاونسفيلد</b>، مهندس في معامل الأبحاث المركزية لشركة EMI في إنجلترا، طور <b>أول جهاز CT نافع إكلينيكياً</b>. أول ماسح للرأس اتثبت في مستشفى أتكينسون-مورلي في ويمبلدون، إنجلترا.</p>"}, {"en": "<p><b>1972:</b> Hounsfield demonstrated the first CT scanner, using Cormack's mathematics.</p>", "ar": "<p><b>1972:</b> هاونسفيلد عرض أول جهاز CT، باستخدام رياضيات كورماك.</p>"}, {"en": "<p><b>1979:</b> Hounsfield and Cormack shared the <b>Nobel Prize in medicine</b> for the development of CT.</p>", "ar": "<p><b>1979:</b> هاونسفيلد وكورماك اتقسموا <b>جائزة نوبل في الطب</b> عن تطوير الـ CT.</p>"}], "terms": [["Alan Cormack", "Medical physicist; 1963 mathematics of reconstruction from x-ray projections.", "فيزيائي طبي؛ صاحب رياضيات إعادة البناء (1963)."], ["Godfrey Hounsfield", "EMI engineer; built the first clinically useful CT scanner (1971).", "مهندس EMI؛ صنع أول جهاز CT إكلينيكي (1971)."], ["Atkinson-Morley Hospital", "Wimbledon, England: where the first clinical CT head scanner was installed (1971).", "المستشفى اللي اتثبت فيه أول ماسح CT للرأس (1971)."]]}, {"id": "ct3", "title_en": "Why plain radiography is not enough", "title_ar": "ليه الأشعة العادية مش كفاية", "figs": ["svg_superimposition"], "blocks": [{"en": "<p>Conventional radiography has two written limitations:</p><ul><li><b>Superimposition</b>: structures overlap each other on the image.</li><li>Difficulty in distinguishing between <b>homogenous objects of non-uniform thickness</b>.</li></ul>", "ar": "<p>للأشعة التقليدية عيبان مكتوبين:</p><ul><li><b>التراكب (Superimposition)</b>: التراكيب بتتداخل فوق بعضها في الصورة.</li><li>صعوبة التمييز بين <b>أجسام متجانسة بسماكات غير منتظمة</b>.</li></ul>"}, {"en": "<p>Its <b>tissue-difference sensitivity</b> is only about <b>5%-10%</b>: two tissues must differ by at least that much before you can tell them apart.</p>", "ar": "<p><b>حساسيتها لفروق الأنسجة</b> حوالي <b>5%-10%</b> بس: يعني لازم نسيجين يختلفوا بالقدر ده على الأقل عشان تقدر تفرق بينهم.</p>"}], "terms": [["superimposition", "Overlying structures stacked on top of each other in a projection image.", "تراكب التراكيب فوق بعضها في صورة الإسقاط."], ["tissue-difference sensitivity", "The smallest tissue contrast difference a modality can show; radiography needs 5%-10%.", "أصغر فرق في تباين الأنسجة تقدر التقنية تظهره؛ الأشعة العادية محتاجة 5%-10%."]]}, {"id": "ct4", "title_en": "Conventional tomography", "title_ar": "التصوير المقطعي التقليدي", "figs": ["svg_blur", "svg_trajectories"], "blocks": [{"en": "<p>Conventional tomography <b>eliminates tissue superimposition</b> (the slide's word; more precisely it <b>reduces</b> it by blurring what is outside the focal plane) and <b>increases the contrast of low subject-contrast tissues</b>.</p>", "ar": "<p>التصوير المقطعي التقليدي <b>بيلغي التراكب</b> (دي كلمة السلايد؛ والأدق إنه <b>بيقلله</b> عن طريق تطمس اللي برة المستوى البؤري) و<b>بيزود تباين الأنسجة ضعيفة التباين</b>.</p>"}, {"en": "<p><b>Blurring principle:</b> the x-ray tube and the image receptor move in coordinated opposite directions around a pivot point called the <b>fulcrum</b>, which lies in the objective plane. Only points at the fulcrum keep the same position on the image receptor and stay sharp; everything above and below is blurred.</p>", "ar": "<p><b>مبدأ التطميس:</b> أنبوبة الأشعة ومستقبل الصورة بيتحركوا في اتجاهين متعاكسين متناسقين حوالين نقطة ارتكاز اسمها <b>الـ fulcrum</b>، اللي بتقع في المستوى الهدفي. النقط اللي عند الـ fulcrum بس هي اللي بتفضل في نفس المكان على المستقبل وبتطلع حادة؛ وكل اللي فوق وتحت بيتطمس.</p>"}, {"en": "<p><b>The five tube trajectories:</b> linear, elliptical, circular, spiral and hypocycloidal. (The spiral here is a tube path, not Spiral CT.)</p>", "ar": "<p><b>مسارات الأنبوبة الخمسة:</b> خطي، إهليجي، دائري، حلزوني، وتحت الدائري (hypocycloidal). (الحلزوني هنا مسار أنبوبة، مش Spiral CT.)</p>"}], "terms": [["fulcrum", "The pivot point in the objective plane; the only level that stays sharp during tomographic motion.", "نقطة الارتكاز في المستوى الهدفي؛ المستوى الوحيد اللي بيفضل حاد أثناء الحركة."], ["trajectory", "The path the x-ray tube follows during a tomographic exposure.", "المسار اللي بتمشيه أنبوبة الأشعة أثناء التعريض."]]}, {"id": "ct5", "title_en": "How the CT image is formed", "title_ar": "إزاي صورة الـ CT بتتكون", "figs": ["gantry3d"], "blocks": [{"en": "<p>A CT image is the result of <b>breaking apart a three-dimensional structure</b> and mathematically putting it back together again, displayed as a two-dimensional image on a screen.</p>", "ar": "<p>صورة الـ CT ناتج <b>تفكيك تركيب ثلاثي الأبعاد</b> وإعادة تركيبه رياضياً تاني، وبتتعرض كصورة ثنائية الأبعاد على الشاشة.</p>"}, {"en": "<p><b>The primary goal of any CT system</b> is to accurately reproduce the internal structures of the body as two-dimensional cross-sectional images. CT achieves this through its superior ability to <b>overcome superimposition</b> and to demonstrate <b>slight differences in tissue contrast</b>.</p>", "ar": "<p><b>الهدف الأساسي لأي نظام CT</b> هو إعادة إنتاج التراكيب الداخلية للجسم بدقة على شكل صور مقطعية ثنائية الأبعاد. والـ CT بيحقق ده بقدرته الفائقة على <b>التغلب على التراكب</b> وإظهار <b>الفروق الصغيرة في تباين الأنسجة</b>.</p>"}, {"en": "<p>Two factors play important roles in CT image formation: <b>collecting many projections</b> of the object, and <b>heavy filtration of the x-ray beam</b>.</p>", "ar": "<p>عاملان ليهم دور مهم في تكوين صورة الـ CT: <b>تجميع إسقاطات كتيرة</b> للجسم، و<b>الفلترة القوية لحزمة الأشعة</b>.</p>"}, {"en": "<p><b>Gantry parts to know:</b> x-ray source, x-ray fan beam, detector array, and the data acquisition system (DAS).</p>", "ar": "<p><b>أجزاء الـ gantry المطلوبة:</b> مصدر الأشعة، الحزمة المروحية (fan beam)، مجموعة الكواشف، ونظام تجميع البيانات (DAS).</p>"}], "terms": [["projection", "One set of transmission measurements through the object from one direction.", "مجموعة قياسات نفاذ عبر الجسم من اتجاه واحد."], ["DAS", "Data acquisition system: collects and digitizes the detector signals.", "نظام تجميع البيانات: بيجمع ويرقمن إشارات الكواشف."], ["fan beam", "The fan-shaped x-ray beam that covers the slice width.", "حزمة الأشعة على شكل مروحة بتغطي سماكة الشريحة."]]}, {"id": "ct6", "title_en": "CT advantages and limitations", "title_ar": "مميزات وحدود الـ CT", "figs": [], "blocks": [{"en": "<p><b>Advantages of CT:</b></p><ul><li>Three-dimensional image <b>free of superimposition</b>.</li><li><b>More sensitive to differences in tissue type</b>: about <b>1%</b>, compared with about 10% for radiography.</li><li>Ability to <b>manipulate and adjust the image after scanning</b> (digital technology).</li></ul>", "ar": "<p><b>مميزات الـ CT:</b></p><ul><li>صورة ثلاثية الأبعاد <b>خالية من التراكب</b>.</li><li><b>أكثر حساسية لفروق نوع النسيج</b>: حوالي <b>1%</b> مقارنة بحوالي 10% للأشعة العادية.</li><li>إمكانية <b>تعديل ومعالجة الصورة بعد المسح</b> (تقنية رقمية).</li></ul>"}, {"en": "<p><b>Limitation:</b> unable to differentiate between tissues with slight contrast differences <b>below 1%</b>. (Keep 1% as the lecture's comparison number; the exact value in practice depends on object size, noise, dose and settings.)</p>", "ar": "<p><b>الحد:</b> مش بيقدر يفرق بين أنسجة فروق التباين بينها <b>أقل من 1%</b>. (احفظ 1% كرقم مقارنة من المحاضرة؛ القيمة الفعلية عملياً بتعتمد على حجم الجسم والضوضاء والجرعة والإعدادات.)</p>"}], "terms": [["1% vs 10%", "CT separates tissue differences of about 1%; conventional radiography needs 5%-10%.", "الـ CT بيفرق فروق أنسجة حوالي 1%؛ الأشعة العادية محتاجة 5%-10%."]]}, {"id": "ct7", "title_en": "CT compared with MRI", "title_ar": "مقارنة الـ CT بالـ MRI", "figs": ["svg_mrict"], "blocks": [{"en": "<p>Comparing the <b>appearance of images</b>: <b>MRI visualizes more soft tissue detail without contrast media</b>.</p>", "ar": "<p>بمقارنة <b>مظهر الصور</b>: <b>الـ MRI بيوضح تفاصيل الأنسجة الرخوة أكتر من غير مادة تباين</b>.</p>"}], "terms": [["MRI", "Magnetic resonance imaging; shows more soft-tissue detail than CT without contrast media.", "الرنين المغناطيسي؛ بيوضح الأنسجة الرخوة أكتر من الـ CT من غير صبغة."]]}, {"id": "ct8", "title_en": "Goals of CT", "title_ar": "أهداف الـ CT", "figs": [], "blocks": [{"en": "<p>The lecture closes with three goals of CT:</p><ul><li><b>Minimal superimposition.</b></li><li><b>Image contrast improvement.</b></li><li><b>Small tissue-difference recording.</b></li></ul>", "ar": "<p>المحاضرة بتقفل بتلات أهداف للـ CT:</p><ul><li><b>أقل تراكب ممكن.</b></li><li><b>تحسين تباين الصورة.</b></li><li><b>تسجيل فروق الأنسجة الصغيرة.</b></li></ul>"}], "terms": []}], "flash": [{"f": "Tomography: word origin", "b": "Greek: tomo = cross-section, layer, cut; graph = something written or drawn."}, {"f": "TAT, CAT, CT", "b": "TAT = Transverse Axial Tomography (1937) - renamed CAT after the digital computer processed the images - then abbreviated to CT."}, {"f": "CTAT and DAT", "b": "Computerized transaxial tomography; digital axial tomography. Other names for CT."}, {"f": "Definition of CT", "b": "The science that creates 2D cross-sectional images from 3D body structures; 2D images can be reconstructed to different viewing modes."}, {"f": "Cormack, 1963", "b": "Developed the mathematical method of reconstructing images from x-ray projections."}, {"f": "Hounsfield, 1971", "b": "EMI engineer who developed the first clinically useful CT scanner (first head scanner at Atkinson-Morley Hospital, Wimbledon)."}, {"f": "Nobel Prize, 1979", "b": "Hounsfield and Cormack shared the Nobel Prize in medicine for the development of CT."}, {"f": "Two limitations of plain radiography", "b": "Superimposition; difficulty distinguishing homogenous objects of non-uniform thickness."}, {"f": "Radiography tissue sensitivity", "b": "About 5%-10%."}, {"f": "Conventional tomography", "b": "Eliminates (reduces by blurring) tissue superimposition and increases contrast of low subject-contrast tissues."}, {"f": "Five tube trajectories", "b": "Linear, elliptical, circular, spiral, hypocycloidal."}, {"f": "Fulcrum principle", "b": "Tube and receptor move around the fulcrum (objective plane); only the fulcrum plane keeps the same position on the receptor and stays sharp."}, {"f": "Primary goal of any CT system", "b": "Accurately reproduce the internal structures of the body as 2D cross-sectional images."}, {"f": "Two factors in CT image formation", "b": "Collecting many projections of the object; heavy filtration of the x-ray beam."}, {"f": "Four labeled gantry parts", "b": "X-ray source, x-ray fan beam, detector array, data acquisition system (DAS)."}, {"f": "Three CT advantages", "b": "3D image free of superimposition; more sensitive to tissue differences (1% vs 10%); image can be manipulated after scanning."}, {"f": "CT limitation", "b": "Cannot differentiate tissues with contrast differences below 1%."}, {"f": "CT vs MRI", "b": "MRI visualizes more soft tissue detail without contrast media."}, {"f": "Three goals of CT", "b": "Minimal superimposition; image contrast improvement; small tissue-difference recording."}], "quiz": [{"q": "The word \"tomo\" in tomography comes from the Greek for:", "o": ["Speed", "Light", "Cross-section, layer or cut", "Computer"], "a": 2, "w": "TOMO = مقطع أو شريحة، وgraph = كتابة أو رسم."}, {"q": "Which is NOT an alternative name for CT?", "o": ["DAT (digital axial tomography)", "CTAT (computerized transaxial tomography)", "MRT (magnetic resonance tomography)", "CAT (computerized axial tomography)"], "a": 2, "w": "الأسماء القديمة: CAT وCTAT وDAT. MRT شيء مختلف."}, {"q": "Computed tomography creates:", "o": ["Two-dimensional cross-sectional images from three-dimensional body structures", "Three-dimensional images from 2D structures", "Only projection images", "Only sound-based images"], "a": 0, "w": "CT بيحول جسم 3D لصور مقطعية 2D."}, {"q": "Who developed the first clinically useful CT scanner in 1971 at EMI?", "o": ["Godfrey Hounsfield", "Wilhelm Roentgen", "Paul Lauterbur", "Alan Cormack"], "a": 0, "w": "Hounsfield اخترع الجهاز في EMI. Cormack صاحب الرياضيات."}, {"q": "Alan Cormack's contribution in 1963 was:", "o": ["A mathematical method for reconstructing images from x-ray projections", "The first clinical scanner", "Contrast media", "The x-ray tube"], "a": 0, "w": "Cormack = الرياضيات، Hounsfield = الجهاز."}, {"q": "Hounsfield and Cormack shared the Nobel Prize in medicine in:", "o": ["1990", "1895", "1971", "1979"], "a": 3, "w": "جائزة نوبل 1979."}, {"q": "Which is a limitation of conventional radiography that CT overcomes?", "o": ["Use of film", "Superimposition of structures", "Use of x-rays", "Digital images"], "a": 1, "w": "أهم عيوب الراديوجرافي التراكب (superimposition)."}, {"q": "Conventional radiography can distinguish tissue differences of about:", "o": ["0.1%", "1%", "5-10%", "50%"], "a": 2, "w": "الراديوجرافي بيفرق 5-10% بس، والـ CT حوالي 1%."}, {"q": "CT is more sensitive to tissue differences than radiography. The lecture compares:", "o": ["1% versus 10%", "50% versus 5%", "0.1% versus 100%", "10% versus 1%"], "a": 0, "w": "CT حوالي 1% مقابل 10% للراديوجرافي."}, {"q": "Conventional tomography:", "o": ["Completely removes all structures outside the plane", "Reduces superimposition by blurring structures outside the focal plane", "Is the same as CT", "Uses no x-ray tube movement"], "a": 1, "w": "الـ tomography التقليدي بيعمل blur للي برة المستوى (السلايد قال eliminates لكن الأدق reduces)."}, {"q": "Which is NOT one of the five tube trajectories in conventional tomography?", "o": ["Elliptical", "Linear", "Hypocycloidal", "Parabolic"], "a": 3, "w": "الخمسة: Linear وElliptical وCircular وSpiral وHypocycloidal."}, {"q": "In the tomographic blurring principle, the structure that stays in the same position on the image receptor is the:", "o": ["Tube", "Fulcrum (objective plane)", "Skin", "Table"], "a": 1, "w": "الـ fulcrum هو النقطة اللي تفضل ثابتة وواضحة."}, {"q": "Which is an advantage of CT?", "o": ["Lower dose than radiography always", "No superimposition but 2D only with no reconstruction", "Cheap equipment", "Ability to manipulate and adjust the image after scanning"], "a": 3, "w": "ميزة CT: معالجة الصورة بعد المسح (digital)."}, {"q": "Which modality shows more soft tissue detail without contrast media according to the lecture?", "o": ["Plain radiography", "MRI", "Conventional tomography", "Fluoroscopy"], "a": 1, "w": "الـ MRI بيوضح soft tissue من غير contrast."}, {"q": "Which is one of the goals of CT?", "o": ["Eliminating the x-ray tube", "Maximum superimposition", "Minimal superimposition, contrast improvement and recording small tissue differences", "Lowest spatial resolution"], "a": 2, "w": "أهداف CT: أقل superimposition وتحسين contrast وتسجيل فروق صغيرة."}], "recall": [{"q": "What does the word tomography mean?", "a": "From Greek: tomo = cross-section/layer/cut, graph = something written or drawn; recording a slice.", "w": "tomo مقطع + graph رسم/تسجيل."}, {"q": "What do TAT, CAT, and CT stand for in the naming history?", "a": "TAT = transverse axial tomography (1937); CAT = computerized axial tomography after a digital computer processed the images; then abbreviated to CT.", "w": "نفس التقنية، أسماء تاريخية مختلفة."}, {"q": "Define computed tomography.", "a": "The science that creates two-dimensional cross-sectional images from three-dimensional body structures; the 2D images can be reconstructed into different viewing modes.", "w": "الجسم زي رغيف وكل صورة شريحة منه."}, {"q": "Who developed the mathematics of CT reconstruction, and who built the first clinically useful scanner?", "a": "Alan Cormack developed the mathematical method in 1963; Godfrey Hounsfield (EMI engineer) built the first clinically useful scanner in 1971; they shared the 1979 Nobel Prize.", "w": "كورماك رياضيات، هاونسفيلد الجهاز. واشتغلوا مستقلين عن بعض."}, {"q": "Where and when was the first clinical CT head scanner installed?", "a": "In 1971 at Atkinson-Morley Hospital in Wimbledon, England.", "w": "١٩٧١، إنجلترا."}, {"q": "Name the two written limitations of plain radiography.", "a": "Superimposition, and difficulty distinguishing homogenous objects of non-uniform thickness.", "w": "تراكب، وصعوبة التمييز لو نفس المادة بسماكات مختلفة."}, {"q": "What tissue difference is needed to be visible on plain radiography?", "a": "About 5%-10%.", "w": "رقم للحفظ، وهتقارنه بالـ ١٪ بتاعة الـ CT."}, {"q": "What does conventional tomography do to superimposition?", "a": "It reduces it (keeps a selected plane sharp while blurring structures above and below) and increases contrast of low subject contrast tissues.", "w": "السلايد كاتب eliminates، والأدق reduces: بيطمس مش بيلغي."}, {"q": "Name the five tube trajectories in conventional tomography.", "a": "Linear, elliptical, circular, spiral, hypocycloidal.", "w": "خمس مسارات لحركة الأنبوبة، والحلزوني هنا مش Spiral CT."}, {"q": "Explain the tomographic blurring principle (fulcrum).", "a": "The tube and image receptor move in coordinated opposite directions around the fulcrum (pivot point) in the objective plane; only the fulcrum plane keeps the same position on the receptor and stays sharp, other points blur.", "w": "نقطة الارتكاز بس اللي بتفضل واضحة."}, {"q": "What is the primary goal of any CT system?", "a": "To accurately reproduce the internal structures of the body as two-dimensional cross-sectional images.", "w": "إعادة إنتاج التراكيب الداخلية بدقة في صور مقطعية."}, {"q": "Which two factors play important roles in CT image formation?", "a": "Collecting many projections of the object, and heavy filtration of the x-ray beam.", "w": "قياسات من اتجاهات كتير + فلترة قوية بتشيل الفوتونات ضعيفة الطاقة."}, {"q": "Name the four labeled parts of the CT gantry.", "a": "X-ray source, x-ray fan beam, detector array, data acquisition system (DAS).", "w": "مصدر، حزمة مروحية، كواشف، ونظام تجميع البيانات."}, {"q": "What are the three advantages of CT?", "a": "1) Three-dimensional image free of superimposition. 2) More sensitive to tissue type differences (1% compared with 10%). 3) Ability to manipulate and adjust the image after scanning (digital technology).", "w": "بدون تراكب، حساسية ١٪، وتعديل بعد التصوير."}, {"q": "What is the stated limitation of CT (and the correction)?", "a": "Unable to differentiate tissues with contrast differences below 1% (as a lecture comparison number; in practice around 0.5% is possible depending on object size, noise, dose, and settings).", "w": "احفظ ١٪ كرقم مقارنة، مش قانون ثابت."}, {"q": "CT vs MRI in image appearance?", "a": "MRI visualizes more soft tissue detail without contrast media.", "w": "MRI أقوى في الأنسجة الرخوة من غير صبغة."}, {"q": "What are the three goals of CT?", "a": "Minimal superimposition, image contrast improvement, small tissue difference recording.", "w": "خلاصة المحاضرة في تلاتة."}]}, "bio": {"name": "Radiobiology", "lec": "Lecture 1 - Introduction to Radiobiology", "short": "Radio", "sections": [{"id": "bio1", "title_en": "Introduction: cells and tissues", "title_ar": "مقدمة: الخلايا والأنسجة", "figs": [], "blocks": [{"en": "<p>The human body is composed of approximately <b>75 trillion cells</b>. These cells are organized into only <b>four categories called tissues</b>.</p>", "ar": "<p>جسم الإنسان مكون من حوالي <b>75 تريليون خلية</b>. الخلايا دي متنظمة في <b>أربع فئات بس اسمها الأنسجة</b>.</p>"}, {"en": "<p><b>Tissue:</b> a group of cells which are similar in structure and which perform common or related functions.</p>", "ar": "<p><b>النسيج:</b> مجموعة خلايا متشابهة في التركيب وبتؤدي وظائف مشتركة أو مترابطة.</p>"}, {"en": "<p><b>Histology:</b> the study of tissues.</p>", "ar": "<p><b>الهيستولوجيا:</b> علم دراسة الأنسجة.</p>"}, {"en": "<p>The four basic types: <b>epithelial, connective, muscle and nervous tissue</b>.</p>", "ar": "<p>الأنواع الأربعة الأساسية: <b>النسيج الظهاري، والضام، والعضلي، والعصبي</b>.</p>"}], "terms": [["tissue", "Group of cells similar in structure performing common or related functions.", "مجموعة خلايا متشابهة التركيب بتؤدي وظائف مشتركة."], ["histology", "The study of tissues.", "علم دراسة الأنسجة."], ["75 trillion", "Approximate number of cells in the human body.", "عدد خلايا جسم الإنسان التقريبي."]]}, {"id": "bio2", "title_en": "Epithelial tissue", "title_ar": "النسيج الظهاري", "figs": ["epi3d"], "blocks": [{"en": "<p><b>Locations:</b> covers the body; lines the cavities, tubes, ducts and blood vessels inside the body; covers the organs inside body cavities.</p>", "ar": "<p><b>الأماكن:</b> بيغطي الجسم؛ وبيبطن التجاويف والأنابيب والقنوات والأوعية الدموية جوه الجسم؛ وبيغطي الأعضاء جوه تجاويف الجسم.</p>"}, {"en": "<p><b>Functions:</b></p><ul><li>Protection from physical and chemical injury.</li><li>Protection against microbial invasion.</li><li>Contains receptors which respond to stimuli.</li><li>Filters, secretes and reabsorbs materials.</li><li>Secretes serous fluids to lubricate structures.</li></ul>", "ar": "<p><b>الوظائف:</b></p><ul><li>الحماية من الإصابة الفيزيائية والكيميائية.</li><li>الحماية ضد الغزو الميكروبي.</li><li>فيه مستقبلات بتستجيب للمؤثرات.</li><li>بيصفّي ويفرز ويعيد امتصاص المواد.</li><li>يفرز سوائل مصلية لتزليق التراكيب.</li></ul>"}, {"en": "<p>By number of layers, epithelium is classified as <b>simple</b> (a single layer of cells) or <b>stratified</b> (many layers).</p>", "ar": "<p>حسب عدد الطبقات، الظهارة بتتصنف <b>بسيطة</b> (طبقة خلية واحدة) أو <b>مطبقة</b> (طبقات كتيرة).</p>"}], "terms": [["simple epithelium", "One layer of cells.", "ظهارة من طبقة واحدة."], ["stratified epithelium", "Many layers of cells.", "ظهارة من طبقات كتيرة."], ["serous fluid", "Watery lubricating secretion of epithelial membranes.", "سائل مصلي مائي بيزلّق الأغشية."]]}, {"id": "bio3", "title_en": "Connective tissue", "title_ar": "النسيج الضام", "figs": ["svg_connective"], "blocks": [{"en": "<p>Connective tissue is the <b>most abundant and widely distributed</b> tissue in the body.</p>", "ar": "<p>النسيج الضام هو <b>أكتر نسيج موجود ومنتشر</b> في الجسم.</p>"}, {"en": "<p><b>Functions:</b> connects, binds and supports structures (tendons, ligaments); protects and cushions organs and tissues; insulates (fat); transports substances (blood).</p>", "ar": "<p><b>الوظائف:</b> بيربط ويدعم التراكيب (الأوتار والأربطة)؛ بيحمي ويدعم الأعضاء والأنسجة؛ بيعزل (الدهون)؛ وبينقل المواد (الدم).</p>"}, {"en": "<p><b>Classification:</b></p><ul><li><b>Connective tissue proper:</b> loose (areolar, adipose, reticular) and dense (regular, irregular, elastic).</li><li><b>Supporting connective tissue:</b> cartilage (hyaline, fibrocartilage, elastic) and bone (compact, spongy).</li><li><b>Fluid connective tissue:</b> blood.</li></ul>", "ar": "<p><b>التصنيف:</b></p><ul><li><b>النسيج الضام الأصلي:</b> رخو (هالي، دهني، شبكي) وكثيف (منتظم، غير منتظم، مرن).</li><li><b>النسيج الضام الداعم:</b> غضروف (زجاجي، ليفي، مرن) وعظم (متراص، إسفنجي).</li><li><b>النسيج الضام السائل:</b> الدم.</li></ul>"}], "terms": [["connective tissue", "Most abundant and widely distributed tissue; connects, supports, cushions, insulates and transports.", "أكتر الأنسجة انتشاراً؛ يربط ويدعم ويحمي ويعزل وينقل."], ["loose connective tissue", "Areolar, adipose and reticular.", "هالي ودهني وشبكي."], ["dense connective tissue", "Regular, irregular and elastic.", "منتظم وغير منتظم ومرن."]]}, {"id": "bio4", "title_en": "Muscle tissue", "title_ar": "النسيج العضلي", "figs": ["skel3d", "card3d", "smooth3d"], "blocks": [{"en": "<p><b>Locations:</b> associated with the bones of the skeleton, the heart, and the walls of the hollow organs.</p>", "ar": "<p><b>الأماكن:</b> مرتبط بعظام الهيكل، والقلب، وجدران الأعضاء المجوفة.</p>"}, {"en": "<p><b>Functions:</b> movement, locomotion, maintains posture, produces heat, facial expressions, pumps blood.</p>", "ar": "<p><b>الوظائف:</b> الحركة، والتنقل، والحفاظ على وضعية الجسم، وإنتاج الحرارة، وتعبيرات الوجه، وضخ الدم.</p>"}, {"en": "<p><b>Cardiac muscle:</b> cells are short, bifurcated and striated, with one or two centrally located nuclei and <b>intercalated discs</b> between cells. Involuntary contraction and relaxation pump blood; located in the heart wall (myocardium).</p>", "ar": "<p><b>العضلة القلبية:</b> خلاياها قصيرة ومتفرعة ومخططة، بنواة أو نواتين في المنتصف و<b>أقراص مقحمة (intercalated discs)</b> بين الخلايا. انقباض لا إرادي بيضخ الدم؛ ومكانها جدار القلب (الميوكارديوم).</p>"}, {"en": "<p><b>Smooth muscle:</b> cells are fusiform (spindle-shaped), short and nonstriated, with one centrally located nucleus. Involuntary movements that move materials through internal organs; found in the walls of hollow organs such as vessels, airways, stomach, bladder and uterus.</p>", "ar": "<p><b>العضلة الملساء:</b> خلاياها مغزلية الشكل، قصيرة وغير مخططة، بنواة واحدة في المنتصف. حركات لا إرادية بتنقل المواد عبر الأعضاء الداخلية؛ موجودة في جدران الأعضاء المجوفة زي الأوعية والمجاري الهوائية والمعدة والمثانة والرحم.</p>"}], "terms": [["intercalated discs", "Junctions between cardiac muscle cells.", "الوصلات بين خلايا عضلة القلب."], ["fusiform", "Spindle-shaped: thick in the middle, tapered at both ends.", "مغزلي: سميك في النص ومدبب من الطرفين."], ["striated", "Showing light and dark bands under the microscope.", "مخطط: خطوط فاتحة وغامقة تحت الميكروسكوب."]]}, {"id": "bio5", "title_en": "Nervous tissue", "title_ar": "النسيج العصبي", "figs": ["neuron3d"], "blocks": [{"en": "<p>Nervous tissue contains two types of cells:</p><ul><li><b>Neurons:</b> nerve cells that are capable of <b>initiating and conducting electrical activity</b> throughout the body.</li><li><b>Neuroglia:</b> cells that <b>support the neurons</b>.</li></ul>", "ar": "<p>النسيج العصبي فيه نوعين من الخلايا:</p><ul><li><b>العصبونات (Neurons):</b> خلايا عصبية قادرة على <b>بدء وتوصيل النشاط الكهربي</b> في الجسم كله.</li><li><b>الخلايا الدبقية (Neuroglia):</b> خلايا <b>بتدعم العصبونات</b>.</li></ul>"}, {"en": "<p>Nervous tissue is the main component of the nervous system: the brain, spinal cord and nerves.</p>", "ar": "<p>النسيج العصبي هو المكون الرئيسي للجهاز العصبي: المخ والحبل الشوكي والأعصاب.</p>"}, {"en": "<p><b>Functions:</b> regulates and controls body functions; generates and transmits nerve impulses; supports, insulates and protects the impulse-generating neurons.</p>", "ar": "<p><b>الوظائف:</b> ينظم ويتحكم في وظائف الجسم؛ يولد وينقل النبضات العصبية؛ يدعم ويعزل ويحمي العصبونات المولدة للنبضات.</p>"}], "terms": [["neuron", "Nerve cell that initiates and conducts electrical activity.", "خلية عصبية بتبدأ وتوصل النشاط الكهربي."], ["neuroglia", "Supporting cells of nervous tissue.", "الخلايا الداعمة للنسيج العصبي."]]}, {"id": "bio6", "title_en": "Tissue change and aging", "title_ar": "تغير الأنسجة والشيخوخة", "figs": [], "blocks": [{"en": "<p>Tissues can undergo change in form, size or number during the aging process:</p><ul><li><b>Hypertrophy:</b> an increase in the <b>size</b> of existing cells.</li><li><b>Hyperplasia:</b> an increase in the <b>number</b> of cells in a tissue.</li><li><b>Neoplasia:</b> out-of-control growth, which forms a <b>tumor</b>.</li><li><b>Atrophy:</b> <b>shrinkage</b> of tissue by cell size or number.</li></ul>", "ar": "<p>الأنسجة ممكن يتغير شكلها أو حجمها أو عددها مع الشيخوخة:</p><ul><li><b>التضخم (Hypertrophy):</b> زيادة في <b>حجم</b> الخلايا الموجودة.</li><li><b>التزايد (Hyperplasia):</b> زيادة في <b>عدد</b> الخلايا في النسيج.</li><li><b>الورم (Neoplasia):</b> نمو خارج السيطرة بيكوّن <b>ورم</b>.</li><li><b>الضمور (Atrophy):</b> <b>انكماش</b> النسيج في حجم الخلايا أو عددها.</li></ul>"}], "terms": [["hypertrophy", "Increase in the size of existing cells.", "زيادة حجم الخلايا الموجودة."], ["hyperplasia", "Increase in the number of cells in a tissue.", "زيادة عدد الخلايا في النسيج."], ["neoplasia", "Out-of-control growth forming a tumor.", "نمو خارج السيطرة يكوّن ورم."], ["atrophy", "Shrinkage of tissue by cell size or number.", "انكماش النسيج في حجم الخلية أو عددها."]]}, {"id": "bio7", "title_en": "Cell types: eukaryotic and prokaryotic", "title_ar": "أنواع الخلايا: حقيقية وأولية النواة", "figs": ["euk3d", "prok3d"], "blocks": [{"en": "<p>Cells are divided into <b>eukaryotic</b> (eu-karyote = with a nucleus) and <b>prokaryotic</b> (pro-karyote = without a nucleus).</p>", "ar": "<p>الخلايا بتتقسم لـ <b>حقيقية النواة (Eukaryotic)</b> يعني ليها نواة، و<b>أولية النواة (Prokaryotic)</b> يعني من غير نواة.</p>"}, {"en": "<p><b>Prokaryotic cells:</b> small cells, always unicellular; no nucleus or any membrane-bound organelles; DNA is circular, without proteins; small 70S ribosomes; no cytoskeleton; division by binary fission; reproduction is always asexual.</p>", "ar": "<p><b>الخلايا أولية النواة:</b> خلايا صغيرة، دايماً وحيدة الخلية؛ مفيش نواة ولا عضيات محاطة بأغشية؛ الـ DNA دائري من غير بروتينات؛ ريبوسومات صغيرة 70S؛ مفيش هيكل خلوي؛ الانقسام بالانشطار الثنائي؛ والتكاثر دايماً لا جنسي.</p>"}, {"en": "<p><b>Eukaryotic cells:</b> larger cells, often multicellular; always have a nucleus and other membrane-bound organelles; DNA is linear and associated with proteins to form chromatin; large 80S ribosomes; always have a cytoskeleton; division by mitosis or meiosis; reproduction is asexual or sexual.</p>", "ar": "<p><b>الخلايا حقيقية النواة:</b> خلايا أكبر، غالباً متعددة الخلايا؛ دايماً ليها نواة وعضيات محاطة بأغشية؛ الـ DNA خطي ومرتبط ببروتينات يكوّن الكروماتين؛ ريبوسومات كبيرة 80S؛ دايماً فيها هيكل خلوي؛ الانقسام ميتوزي أو ميوزي؛ والتكاثر لا جنسي أو جنسي.</p>"}, {"en": "<p class=\"note\"><b>Correction:</b> the summary table in the slides gives the sizes as \"&lt; 5 nm\" and \"&gt; 10 nm\". The intended unit is micrometers (µm), not nanometers.</p>", "ar": "<p class=\"note\"><b>تصحيح:</b> جدول المقارنة في السلايدات كاتب الأحجام \"&lt; 5 nm\" و\"&gt; 10 nm\". الوحدة المقصودة هي الميكرومتر (µm) مش النانومتر.</p>"}], "terms": [["eukaryote", "Cell with a true nucleus and membrane-bound organelles.", "خلية ليها نواة حقيقية وعضيات محاطة بأغشية."], ["prokaryote", "Cell without a nucleus or membrane-bound organelles.", "خلية من غير نواة ولا عضيات محاطة بأغشية."], ["chromatin", "Linear DNA associated with proteins in eukaryotic cells.", "الـ DNA الخطي المرتبط بالبروتينات في حقيقيات النواة."], ["binary fission", "Asexual cell division of prokaryotes.", "الانشطار الثنائي اللاجنسي في أوليات النواة."]]}], "flash": [{"f": "Cells of the body", "b": "About 75 trillion cells, organized into only four categories called tissues."}, {"f": "Tissue (definition)", "b": "A group of cells which are similar in structure and perform common or related functions."}, {"f": "Histology", "b": "The study of tissues."}, {"f": "The four tissue types", "b": "Epithelial, connective, muscle, nervous."}, {"f": "Epithelial tissue: locations", "b": "Covers the body; lines cavities, tubes, ducts and blood vessels; covers organs inside body cavities."}, {"f": "Epithelial tissue: functions", "b": "Protection (physical, chemical, microbial); receptors responding to stimuli; filters, secretes and reabsorbs; secretes serous lubricating fluids."}, {"f": "Simple vs stratified epithelium", "b": "Simple = one layer of cells; stratified = many layers."}, {"f": "Connective tissue", "b": "The most abundant and widely distributed tissue in the body."}, {"f": "Connective tissue: functions", "b": "Connects, binds and supports (tendons, ligaments); protects and cushions; insulates (fat); transports (blood)."}, {"f": "Connective tissue classification", "b": "Proper (loose: areolar, adipose, reticular; dense: regular, irregular, elastic); supporting (cartilage, bone); fluid (blood)."}, {"f": "Muscle tissue: functions", "b": "Movement, locomotion, posture, heat production, facial expressions, pumping blood."}, {"f": "Cardiac muscle", "b": "Short, bifurcated, striated cells; 1-2 central nuclei; intercalated discs; involuntary; heart wall (myocardium)."}, {"f": "Smooth muscle", "b": "Fusiform, short, nonstriated cells; one central nucleus; involuntary; walls of hollow organs."}, {"f": "Neurons vs neuroglia", "b": "Neurons initiate and conduct electrical activity; neuroglia support the neurons."}, {"f": "Nervous tissue: functions", "b": "Regulates and controls body functions; generates and transmits nerve impulses; supports, insulates and protects neurons."}, {"f": "Hypertrophy vs hyperplasia", "b": "Hypertrophy = increase in cell size; hyperplasia = increase in cell number."}, {"f": "Neoplasia vs atrophy", "b": "Neoplasia = out-of-control growth (tumor); atrophy = shrinkage of tissue."}, {"f": "Prokaryotic cell", "b": "No nucleus or membrane-bound organelles; circular DNA without proteins; 70S ribosomes; no cytoskeleton; binary fission; always unicellular and asexual."}, {"f": "Eukaryotic cell", "b": "Nucleus + membrane-bound organelles; linear DNA with proteins (chromatin); 80S ribosomes; cytoskeleton; mitosis or meiosis; often multicellular."}], "quiz": [{"q": "Approximately how many cells make up the human body, and into how many tissue categories are they organized?", "o": ["About 75 million cells, 3 tissue types", "About 75 trillion cells, 4 tissue types", "About 75 billion cells, 4 tissue types", "About 75 trillion cells, 6 tissue types"], "a": 1, "w": "الجسم حوالي 75 تريليون خلية متنظمة في 4 أنواع أنسجة بس."}, {"q": "Histology is best defined as the study of:", "o": ["Individual cells only", "Ionizing radiation effects", "Organ systems", "Tissues"], "a": 3, "w": "Histology = علم الأنسجة، والنسيج مجموعة خلايا متشابهة في التركيب والوظيفة."}, {"q": "Which of the following is NOT one of the four basic tissue types?", "o": ["Nervous tissue", "Muscle tissue", "Glandular tissue", "Epithelial tissue"], "a": 2, "w": "الأربعة: Epithelial وConnective وMuscle وNervous. Glandular مش نوع رئيسي."}, {"q": "Which of these is a function of epithelial tissue?", "o": ["Pumping blood", "Protection against microbial invasion and secretion of serous fluids", "Generating nerve impulses", "Storing minerals in a solid matrix"], "a": 1, "w": "الـ epithelium بيغطي ويبطّن ويحمي ويفرز ويمتص. النبضات للعصبي والضخ للقلب."}, {"q": "Epithelium made of many layers of cells is classified as:", "o": ["Apical", "Basal", "Simple", "Stratified"], "a": 3, "w": "Simple = طبقة واحدة، Stratified = طبقات كتير. Apical وBasal أسطح مش أنواع."}, {"q": "Which is the most abundant and widely distributed tissue in the body?", "o": ["Connective tissue", "Muscle tissue", "Epithelial tissue", "Nervous tissue"], "a": 0, "w": "الـ Connective هو الأكتر انتشاراً (يربط ويدعم ويحمي وينقل)."}, {"q": "In the classification of connective tissue, blood belongs to:", "o": ["Fluid connective tissue", "Dense connective tissue", "Loose connective tissue", "Supporting connective tissue"], "a": 0, "w": "الدم = fluid connective. الغضروف والعظم = supporting."}, {"q": "Which of these is a type of loose connective tissue?", "o": ["Hyaline cartilage", "Adipose tissue", "Elastic dense tissue", "Compact bone"], "a": 1, "w": "Loose = Areolar وAdipose وReticular. Hyaline غضروف وCompact عظم."}, {"q": "Which cells in nervous tissue initiate and conduct electrical activity?", "o": ["Neurons", "Adipocytes", "Fibroblasts", "Neuroglia"], "a": 0, "w": "الـ Neurons بتبدأ وتوصل الإشارة، والـ Neuroglia بتدعمها بس."}, {"q": "A muscle with short, bifurcated, striated cells, one or two central nuclei and intercalated discs is:", "o": ["Smooth muscle", "Neuroglia", "Cardiac muscle", "Skeletal muscle"], "a": 2, "w": "Intercalated discs علامة العضلة القلبية."}, {"q": "Which description fits smooth muscle?", "o": ["Cells with axons and dendrites", "Fusiform, short, nonstriated, one central nucleus", "Long striated fibers with many peripheral nuclei", "Branched, striated, with intercalated discs"], "a": 1, "w": "Smooth = مغزلية الشكل وبدون striations ونواة واحدة في النص."}, {"q": "An increase in the NUMBER of cells in a tissue is called:", "o": ["Neoplasia", "Hypertrophy", "Hyperplasia", "Atrophy"], "a": 2, "w": "Hyperplasia = زيادة العدد. Hypertrophy = زيادة الحجم."}, {"q": "Out-of-control cell growth that forms a tumor is called:", "o": ["Neoplasia", "Hyperplasia", "Atrophy", "Hypertrophy"], "a": 0, "w": "Neoplasia = نمو خارج السيطرة وبيكوّن ورم. Atrophy = ضمور."}, {"q": "Which statement about prokaryotic cells is correct?", "o": ["They divide by mitosis or meiosis", "DNA is linear and forms chromatin", "They have a nucleus and membrane-bound organelles", "DNA is circular without proteins and division is by binary fission"], "a": 3, "w": "Prokaryotic: DNA دائري، 70S، من غير نواة. الباقي صفات eukaryotic."}, {"q": "In the lecture summary table, cell sizes are given as \"< 5 nm\" and \"> 10 nm\". What is the correct unit?", "o": ["cm (centimeters)", "pm (picometers)", "µm (micrometers)", "mm (millimeters)"], "a": 2, "w": "الوحدة الصح µm، والسلايد غلطان في كتابتها nm."}], "recall": [{"q": "Approximately how many cells make up the human body?", "a": "About 75 trillion cells.", "w": "احفظ الرقم: حوالي ٧٥ تريليون خلية."}, {"q": "Into how many categories are all body cells organized, and what are these categories called?", "a": "Only four categories, called tissues.", "w": "٧٥ تريليون خلية متنظمة في ٤ أنسجة بس."}, {"q": "Define \"tissue\".", "a": "A group of cells which are similar in structure and perform common or related functions.", "w": "مجموعة خلايا متشابهة في التركيب وبتعمل وظائف مشتركة أو مترابطة. التعريف بييجي في الامتحان زي ما هو."}, {"q": "What is histology?", "a": "The study of tissues.", "w": "علم الأنسجة."}, {"q": "Name the four basic types of tissues.", "a": "Epithelial, connective, muscle, and nervous tissue.", "w": "الطلائي (الظهاري)، الضام، العضلي، العصبي. احفظهم بالترتيب."}, {"q": "What is the difference between simple and stratified epithelium?", "a": "Simple epithelium = one layer of cells; stratified epithelium = several layers.", "w": "Simple صف واحد، Stratified صفوف كتير."}, {"q": "On an epithelial cell, what do apical, basal, and lateral surfaces mean?", "a": "Apical faces the open space, basal sits on the basement membrane, lateral faces neighboring cells.", "w": "القمة ناحية الفراغ، القاعدة على الغشاء القاعدي، والجوانب ناحية الخلايا الجيران."}, {"q": "Which tissue is the most abundant and widely distributed in the body?", "a": "Connective tissue.", "w": "النسيج الضام هو الأكثر وفرة والأوسع انتشاراً."}, {"q": "Name the main functions of connective tissue.", "a": "Connects, binds and supports structures (tendons, ligaments); protects and cushions organs; insulates (fat); transports substances (blood).", "w": "يربط ويدعم، يحمي ويبطّن، يعزل حرارياً بالدهون، وينقل المواد عن طريق الدم. خد بالك: الدم نفسه نسيج ضام."}, {"q": "What is the common embryonic origin of all connective tissues?", "a": "Mesenchyme.", "w": "الميزنشيم، النسيج الجنيني الأصلي لكل الأنسجة الضامة."}, {"q": "What are the three branches of connective tissue classification?", "a": "Connective tissue proper (loose + dense), supporting connective tissue (cartilage + bone), and fluid connective tissue (blood).", "w": "أصل واحد (mesenchyme) لتلات فروع: proper و supporting و fluid."}, {"q": "What is the direction of the signal through a neuron?", "a": "Dendrite -> cell body -> axon.", "w": "التفرعات الشجيرية تستقبل، جسم الخلية فيه النواة، والمحور يوصّل الإشارة بره."}, {"q": "Which germ layers give rise to epithelial tissue (Table 4.1)?", "a": "All three: ectoderm, mesoderm, and endoderm.", "w": "الطلائي بس اللي بيطلع من التلات طبقات الجنينية. Connective وmuscle من mesoderm، وnervous من ectoderm."}, {"q": "List the general characteristics of epithelial tissue (Table 4.1).", "a": "Cellular, polar, attached, avascular, innervated, high regeneration capacity.", "w": "خلوي، قطبى (له قمة وقاعدة)، ملتصق، بلا أوعية دموية، مُعصَّب، وقدرته على التجدد عالية."}, {"q": "Hypertrophy vs hyperplasia?", "a": "Hypertrophy = increase in the size of existing cells; hyperplasia = increase in the number of cells.", "w": "trophy = حجم، plasia = عدد."}, {"q": "Neoplasia vs atrophy?", "a": "Neoplasia = out-of-control growth that forms a tumor; atrophy = shrinkage of tissue by cell size or number.", "w": "neo = نمو جديد خارج السيطرة (ورم)، a-trophy = ضمور."}, {"q": "Eukaryote vs prokaryote: what is the defining difference?", "a": "Eukaryote = cell with a nucleus; prokaryote = cell without a nucleus.", "w": "eu = نواة حقيقية موجودة، pro = بدائية من غير نواة."}, {"q": "Ribosome size in prokaryotic vs eukaryotic cells?", "a": "Prokaryotic: small, 70S. Eukaryotic: large, 80S.", "w": "٧٠ صغيرة، ٨٠ كبيرة."}, {"q": "How does cell division differ between prokaryotes and eukaryotes?", "a": "Prokaryotes divide by binary fission; eukaryotes divide by mitosis or meiosis.", "w": "انشطار ثنائي ضد انقسام ميتوزي أو ميوزي."}, {"q": "How does DNA differ between prokaryotes and eukaryotes?", "a": "Prokaryotic DNA is circular without proteins; eukaryotic DNA is linear and associated with proteins to form chromatin.", "w": "دائري من غير بروتين ضد خطي مرتبط ببروتين بيكوّن كروماتين."}, {"q": "What are the approximate cell sizes of prokaryotes and eukaryotes (with the corrected unit)?", "a": "Prokaryotic < 5 µm, eukaryotic > 10 µm (the slide wrongly says nm; the correct unit is micrometers).", "w": "السلايد كاتب nm والصح µm، احفظ الأرقام بالميكرومتر."}]}};

euk3d: {title:"Eukaryotic cell (simplified)", build(g,T,label){

  const nus=new T.Mesh(new T.SphereGeometry(0.4,14,10),new T.MeshPhongMaterial({color:0x4c1d95}));
  nus.position.set(0.5,0.2,0); g.add(nus);
  for(let i=0;i<5;i++){const a=i*1.25+0.4;
    const m=new T.Group();
    const cy=new T.Mesh(new T.CylinderGeometry(0.22,0.22,0.7,10),new T.MeshPhongMaterial({color:0xf59e0b}));
    const s1=new T.Mesh(new T.SphereGeometry(0.22,10,8),new T.MeshPhongMaterial({color:0xf59e0b}));
    const s2=s1.clone(); s1.position.y=0.35; s2.position.y=-0.35; m.add(cy,s1,s2);
    m.position.set(1.9*Math.cos(a),1.1*Math.sin(a*1.7),1.9*Math.sin(a)); m.rotation.set(a,0,a*0.7); g.add(m);}

    gg.scale.set(1.4,0.28,0.8); gg.position.set(-1.3,-0.9+i*0.28,1.1); g.add(gg);}
  for(let i=0;i<16;i++){const r=new T.Mesh(new T.SphereGeometry(0.09,6,5),new T.MeshPhongMaterial({color:0x1e40af}));

}},

const STORE_KEY="jinoStudyV1";
let S={};
try{S=JSON.parse(localStorage.getItem(STORE_KEY)||"{}")}catch(e){S={}}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}}
function st(sid){ if(!S[sid])S[sid]={read:[],flash:{},quizBest:0,quizAtt:0,recall:{}}; return S[sid]; }
if(!S.lang)S.lang={};

let cur=null, tab="learn", qi=0, qscore=0, qmiss=[], qlock=false;
let fi=0, flipped=false, deck=null, deckMode="all";
let ri=0, rshown=false, rdeck=null;

const $=s=>document.querySelector(s);
const hdr=$("#hdr"), app=$("#app");
function pct(n,d){return d?Math.round(n/d*100):0}

function subjProgress(sid){
 const d=DATA[sid], s=st(sid);
 const parts=[
  pct(s.read.length, d.sections.length),
  pct(Object.keys(s.flash).filter(k=>s.flash[k]).length, d.flash.length),
  s.quizAtt? s.quizBest : 0,
  pct(Object.keys(s.recall).filter(k=>s.recall[k]).length, d.recall.length),
 ];
 return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
}
function headerHome(){ hdr.innerHTML=`<div class="hrow"><h1>Jino Study</h1><button class="tourbtn" onclick="tourStart()">؟ جولة</button></div><p>Semester 1 - Faculty of Radiography · offline</p>`; }
function headerSubj(sid){ const d=DATA[sid]; hdr.innerHTML=`<button class="back" onclick="goHome()">&#8592; All subjects</button><div class="hrow"><h1>${d.name}</h1><button class="tourbtn" onclick="tourStart()">؟ جولة</button></div><p>${d.lec}</p>`; }

function goHome(){cur=null;render()}
window.goHome=goHome;
function goSubj(sid,t){cur=sid;tab=t||"learn";qi=0;qscore=0;qmiss=[];fi=0;flipped=false;deck=null;ri=0;rshown=false;rdeck=null;render();window.scrollTo(0,0)}
window.goSubj=goSubj;
function setTab(t){tab=t;qi=0;qscore=0;qmiss=[];qlock=false;fi=0;flipped=false;deck=null;deckMode="all";ri=0;rshown=false;rdeck=null;render()}
window.setTab=setTab;

function home(){
 headerHome();
 let h="";
 for(const sid of ['ct','bio']){
  const d=DATA[sid], p=subjProgress(sid);
  h+=`<button class="card subj" onclick="goSubj('${sid}')">
    <h2>${d.name}</h2><div class="lec">${d.lec}</div>
    <div class="bar"><div style="width:${p}%"></div></div>
    <div class="pct">${p}% complete - ${d.sections.length} sections · ${d.flash.length} cards · ${d.quiz.length} quiz Qs · ${d.recall.length} recall Qs</div>
  </button>`;
 }
 const pl=planStats();
 h+=`<button class="card subj" onclick="goPlan()">
   <h2>Study plan - جدول المذاكرة</h2><div class="lec">${pl.today>0?pl.today+" sessions today":'No sessions today'} · week ${pl.week} of ${PLAN_WEEKS}</div>
   <div class="bar"><div style="width:${pl.pct}%"></div></div>
   <div class="pct">${pl.done}/${pl.total} sessions done (${pl.pct}%)</div>
 </button>`;
 h+=`<div class="footer-note">Content from your lecture slides only. Figures are original redrawn illustrations, not the slide images.<br>Tap any English word for its Arabic translation · select a sentence for a paragraph translation.<br>Progress is saved on this device.</div>`;

}

function tabsHtml(sid){
 const t=[["learn","Learn"],["cards","Cards"],["quiz","Quiz"],["recall","Recall"],["prog","Progress"]];
 return `<div class="tabs">`+t.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join("")+`</div>`;
}

function toggleLang(btn,secid){
 S.lang[secid]=!S.lang[secid];save();
 const card=btn.closest(".sec");
 card.classList.toggle("show-ar",S.lang[secid]);
 btn.classList.toggle("on",S.lang[secid]);
 btn.setAttribute("aria-checked",S.lang[secid]?"true":"false");
 btn.querySelector(".knob").textContent=S.lang[secid]?"ع":"EN";
}
window.toggleLang=toggleLang;

function toggleTerm(el){ const n=el.nextElementSibling; n.style.display=n.style.display==="block"?"none":"block"; }
window.toggleTerm=toggleTerm;

function markRead(sid,id){
 const s=st(sid); const i=s.read.indexOf(id);
 if(i<0)s.read.push(id);else s.read.splice(i,1);
 save();render();
}
window.markRead=markRead;

function learn(sid){
 const d=DATA[sid], s=st(sid);
 let h="";
 for(const sec of d.sections){
  const done=s.read.includes(sec.id);
  const arOn=!!S.lang[sec.id];
  h+=`<div class="card sec ${arOn?'show-ar':''}" data-sec="${sec.id}">
   <div class="sechead"><h3>${sec.title_en}</h3><button class="langbtn ${arOn?'on':''}" role="switch" aria-checked="${arOn?'true':'false'}" aria-label="Arabic translation" onclick="toggleLang(this,'${sec.id}')"><span class="knob">${arOn?'ع':'EN'}</span></button></div>
   <div class="sec-ar-title">${sec.title_ar||""}</div>`;
  sec.blocks.forEach((b,i)=>{
   h+=`<div class="blk" data-bid="${sec.id}-${i}">${b.en}<div class="arb">${b.ar}</div></div>`;
  });
  for(const f of sec.figs||[])h+=figHtml(f);
  if(sec.terms&&sec.terms.length){
   h+=`<div class="chips">`+sec.terms.map(t=>`<button class="chip" onclick="toggleTerm(this)">${t[0]}</button><div class="termdef" style="display:none">${t[1]}<span class="ar">${t[2]||""}</span></div>`).join("")+`</div>`;
  }
  h+=`<button class="readbtn ${done?'done':''}" onclick="markRead('${sid}','${sec.id}')">${done?'✓ Read':'Mark as read'}</button></div>`;
 }
 return h;
}

/* ---------- flashcards ---------- */
function getDeck(sid){
 if(!deck){
  const d=DATA[sid], s=st(sid);
  deck=d.flash.map((c,i)=>i);
  if(deckMode==="todo")deck=deck.filter(i=>!s.flash[i]);
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
 }
 return deck;
}
function cards(sid){
 const d=DATA[sid], s=st(sid);
 const mastered=Object.keys(s.flash).filter(k=>s.flash[k]).length;
 const dk=getDeck(sid);
 if(fi>=dk.length){
  deck=null;
  return `<div class="card center"><div class="score-big">Done</div>
   <p>You finished this deck. Mastered ${mastered}/${d.flash.length} cards.</p>
   <button class="btn" onclick="restartDeck('${sid}','all')">Review all again</button>
   <button class="btn ghost" onclick="restartDeck('${sid}','todo')">Only cards not mastered (${d.flash.length-mastered})</button></div>`;
 }
 const c=d.flash[dk[fi]];
 return `<div class="card">
  <div class="prog">Card ${fi+1}/${dk.length} · mastered ${mastered}/${d.flash.length}</div>
  <div class="flash card" style="margin:0;box-shadow:none;border:2px dashed #c7d2fe" onclick="flip()">
   <div class="inner ${flipped?'backface':''}">${flipped?c.b:c.f}</div>
   <div class="hint">${flipped?'':'tap to flip'}</div>
  </div>
  ${flipped?`<div class="fnav"><button class="no" onclick="flashAns('${sid}',false)">مش عرفتها</button><button class="yes" onclick="flashAns('${sid}',true)">عرفتها ✓</button></div>`:""}
 </div>`;
}
function flip(){flipped=true;render()}
window.flip=flip;
function flashAns(sid,ok){ const s=st(sid);const dk=getDeck(sid); s.flash[dk[fi]]=ok;save(); fi++;flipped=false;render(); }
window.flashAns=flashAns;
function restartDeck(sid,mode){deck=null;deckMode=mode;fi=0;flipped=false;render()}
window.restartDeck=restartDeck;

/* ---------- quiz ---------- */
function quiz(sid){
 const d=DATA[sid], s=st(sid);
 const Q=d.quiz;
 if(qi>=Q.length){
  const p=pct(qscore,Q.length);
  if(p>s.quizBest)s.quizBest=p;
  s.quizAtt++;save();
  const msg=p>=90?"جامد جداً يا جينو 🔥":p>=70?"كويس، راجع الغلطات 👌":"محتاج مراجعة تانية، بس هتظبط 💪";
  let h=`<div class="card center"><div class="score-big">${qscore}/${Q.length}</div>
   <p><b>${p}%</b> · ${msg}</p>
   <p class="small">Best score: ${s.quizBest}% · attempts: ${s.quizAtt}</p>
   <button class="btn" onclick="restartQuiz()">حاول تاني · Retry</button></div>`;
  if(qmiss.length){
   h+=`<div class="card"><b>راجع الأسئلة دي:</b>`+qmiss.map(m=>`<div class="missed"><b>${m.q}</b><br>Correct: ${m.o[m.a]}<span class="ar" style="display:block;direction:rtl;text-align:right;color:#57534e">${m.w}</span></div>`).join("")+`</div>`;
  }
  return h;
 }
 const q=Q[qi];
 let h=`<div class="card"><div class="prog">Question ${qi+1}/${Q.length} · score ${qscore}</div>
  <div class="q">${q.q}</div>`;
 q.o.forEach((op,i)=>{
  let cls="opt";
  if(qlock){if(i===q.a)cls+=" ok";else if(i===q.sel)cls+=" bad";}
  h+=`<button class="${cls}" ${qlock?"disabled":""} onclick="ans('${sid}',${i})">${op}</button>`;
 });
 if(qlock){
  const right=q.sel===q.a;
  h+=`<div class="fb ${right?'ok':'bad'}">${right?'✅ Correct':'❌ Not quite'}<span class="ar">${q.w}</span></div>
   <button class="btn" onclick="nextQ()">${qi+1===Q.length?'See result':'Next'}</button>`;
 }
 return h+`</div>`;
}
function ans(sid,i){ if(qlock)return; const q=DATA[sid].quiz[qi]; q.sel=i;qlock=true; if(i===q.a)qscore++;else qmiss.push(q); render(); }
window.ans=ans;
function nextQ(){qi++;qlock=false;render()}
window.nextQ=nextQ;
function restartQuiz(){qi=0;qscore=0;qmiss=[];qlock=false;DATA[cur].quiz.forEach(q=>delete q.sel);render()}
window.restartQuiz=restartQuiz;

/* ---------- recall ---------- */
function getRdeck(sid){ if(!rdeck){rdeck=DATA[sid].recall.map((c,i)=>i)} return rdeck; }
function recall(sid){
 const d=DATA[sid], s=st(sid);
 const dk=getRdeck(sid);
 const done=Object.keys(s.recall).filter(k=>s.recall[k]).length;
 if(ri>=dk.length){
  rdeck=null;
  return `<div class="card center"><div class="score-big">Done</div>
  <p>You marked yourself right on ${done}/${d.recall.length} recall questions.</p>
  <button class="btn" onclick="restartRecall()">Start over</button></div>`;
 }
 const c=d.recall[dk[ri]];
 let h=`<div class="card"><div class="prog">Recall ${ri+1}/${dk.length} · answered right ${done}/${d.recall.length}</div>
  <div class="q">${c.q}</div>
  <p class="small">Answer out loud or in your head, then show the model answer and grade yourself honestly.</p>`;
 if(rshown){
  h+=`<div class="model">${c.a}<span class="ar" style="display:block;direction:rtl;text-align:right;margin-top:6px;color:#57534e">${c.w}</span></div>
   <div class="fnav"><button class="no" onclick="recallAns('${sid}',false)">غلط / مش متأكد</button><button class="yes" onclick="recallAns('${sid}',true)">صح ✓</button></div>`;
 }else{
  h+=`<button class="btn ghost" onclick="showRecall()">Show model answer</button>`;
 }
 return h+`</div>`;
}
function showRecall(){rshown=true;render()}
window.showRecall=showRecall;
function recallAns(sid,ok){ const s=st(sid);const dk=getRdeck(sid); s.recall[dk[ri]]=ok;save(); ri++;rshown=false;render(); }
window.recallAns=recallAns;
function restartRecall(){ri=0;rshown=false;rdeck=null;render()}
window.restartRecall=restartRecall;

/* ---------- progress ---------- */
function prog(sid){

 h+=`<div class="prow"><div class="lbl">Quiz best</div><div class="bar"><div style="width:${s.quizBest}%"></div></div><div class="val">${s.quizBest}%</div></div>`;

function cleanWord(w){return (w||"").toLowerCase().replace(/^[^a-z]+|[^a-z%]+$/g,"")}
function lookupWord(w){
 w=cleanWord(w);
 if(!w)return null;
 if(GLOS[w])return {term:w,ar:GLOS[w][0],en:GLOS[w][1]};
 if(w.endsWith("s")&&GLOS[w.slice(0,-1)]){const g=GLOS[w.slice(0,-1)];return{term:w.slice(0,-1),ar:g[0],en:g[1]}}
 return null;
}
function wordAtPoint(x,y){
 let node,off;
 if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(x,y);if(!r)return null;node=r.startContainer;off=r.startOffset;}
 else return null;
 if(!node||node.nodeType!==3)return null;
 const t=node.textContent;
 const isL=c=>/[a-zA-Z\-']/.test(c);
 let a=off,b=off;
 while(a>0&&isL(t[a-1]))a--;
 while(b<t.length&&isL(t[b]))b++;
 const word=t.slice(a,b);
 const rest=t.slice(b).trimStart();
 const nw=(rest.match(/^[a-zA-Z\-']+/)||[""])[0];
 return {word:word,next:nw};
}
app.addEventListener("click",function(e){
 const sec=e.target.closest(".sec,.flash,.q,.missed,.model,.opt");
 if(!sec)return;
 if(e.target.closest("button,a,canvas,.langbtn,.chip,.readbtn,.fnav"))return;
 if(window.getSelection&&String(window.getSelection()).length>0)return;
 const w=wordAtPoint(e.clientX,e.clientY);
 if(!w||!w.word||w.word.length<2)return;
 let hit=lookupWord(w.word+" "+w.next)||lookupWord(w.word);
 if(hit){
  showPop(e.clientX,e.clientY,`<div class="par">${hit.ar}</div>${hit.en?`<div class="pen">${hit.term} - ${hit.en}</div>`:`<div class="pen">${hit.term}</div>`}<div class="prow2"><button onclick="speak('${hit.term.replace(/'/g,"")}')">🔊 نطق</button><button onclick="hidePop()">قفل</button></div>`);

 }

/* ---------- 3D viewers ---------- */
const viewers=[];
function makeLabel(T,text){
 const c=document.createElement("canvas");c.width=512;c.height=64;
 const x=c.getContext("2d");
 x.fillStyle="rgba(20,15,50,0.72)";x.fillRect(0,0,512,64);
 x.font="bold 30px Arial";x.fillStyle="#fff";x.textAlign="center";x.textBaseline="middle";
 x.fillText(text,256,34);
 const tx=new T.CanvasTexture(c);
 const sp=new T.Sprite(new T.SpriteMaterial({map:tx,transparent:true}));
 sp.scale.set(2.6,0.33,1);
 return sp;
}
function initViewer(el){
 const sid=el.dataset.scene;
 const def=SCENES[sid];if(!def)return;
 const W=el.clientWidth,H=270;
 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
 renderer.setSize(W,H);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 el.appendChild(renderer.domElement);
 const scene=new THREE.Scene();
 const cam=new THREE.PerspectiveCamera(45,W/H,0.1,100);
 cam.position.set(0,0.5,9);
 scene.add(new THREE.AmbientLight(0xffffff,0.75));
 const dl=new THREE.DirectionalLight(0xffffff,0.8);dl.position.set(4,6,6);scene.add(dl);
 const dl2=new THREE.DirectionalLight(0xa5b4fc,0.35);dl2.position.set(-5,-3,-4);scene.add(dl2);
 const g=new THREE.Group();scene.add(g);
 def.build(g,THREE,function(t,x,y,z){const s=makeLabel(THREE,t);s.position.set(x,y,z);g.add(s);});
 // frame content
 const box=new THREE.Box3().setFromObject(g);
 const c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3()).length();
 g.traverse(o=>{if(o.isSprite)o.scale.multiplyScalar(sz/6)});
 g.position.sub(c);
 cam.position.set(0,0,Math.max(6,sz*1.15));
 let ry=0.4,rx=0.15,dist=cam.position.z,auto=true,idleT=null;
 const ptrs=new Map();let lastD=0;
 const cv=renderer.domElement;
 cv.style.touchAction="none";
 cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});auto=false;if(idleT)clearTimeout(idleT);});
 cv.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const p=ptrs.get(e.pointerId);
  if(ptrs.size===1){ry+=(e.clientX-p.x)*0.012;rx+=(e.clientY-p.y)*0.012;rx=Math.max(-1.4,Math.min(1.4,rx));}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const a=[...ptrs.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastD>0)dist=Math.max(sz*0.5,Math.min(sz*2.4,dist*lastD/d));lastD=d;}
 });
 function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)lastD=0;idleT=setTimeout(()=>auto=true,2600);}
 cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
 cv.addEventListener("wheel",e=>{e.preventDefault();dist=Math.max(sz*0.5,Math.min(sz*2.4,dist+e.deltaY*0.01));auto=false;},{passive:false});
 let visible=false;
 new IntersectionObserver(en=>{visible=en[0].isIntersecting},{threshold:0.05}).observe(el);
 function loop(){
  requestAnimationFrame(loop);
  if(!visible)return;
  if(auto)ry+=0.004;
  g.rotation.y=ry;g.rotation.x=rx;
  cam.position.z+=(dist-cam.position.z)*0.18;
  renderer.render(scene,cam);
 }
 loop();
}
function initViewers(){
 document.querySelectorAll(".viewer:not([data-init])").forEach(el=>{el.dataset.init="1";initViewer(el)});
}


/* ---------- study plan ---------- */
const PLAN_WEEKS=7;
const DAYS=[[6,"السبت","Sat"],[0,"الأحد","Sun"],[1,"الاتنين","Mon"],[2,"التلات","Tue"],[3,"الأربع","Wed"],[4,"الخميس","Thu"],[5,"الجمعة","Fri"]];
let planWeek=1, planFormDay=null;
function planState(){
 if(!S.plan){
  S.plan={};
  // prefill: Sat+Tue = next CT lecture, Sun+Wed = next Radio lecture, Fri = review
  let ctI=0,bioI=0;
  for(let w=1;w<=PLAN_WEEKS;w++){
   S.plan[w]={6:[],0:[],1:[],2:[],3:[],4:[],5:[]};
   const rev=[];
   if(ctI<LECTURES.ct.length){S.plan[w][6].push({s:"ct",l:ctI,done:false});rev.push("CT "+(ctI+1));ctI++}
   if(bioI<LECTURES.bio.length){S.plan[w][0].push({s:"bio",l:bioI,done:false});rev.push("Radio "+(bioI+1));bioI++}
   if(ctI<LECTURES.ct.length){S.plan[w][2].push({s:"ct",l:ctI,done:false});rev.push("CT "+(ctI+1));ctI++}
   if(bioI<LECTURES.bio.length){S.plan[w][3].push({s:"bio",l:bioI,done:false});rev.push("Radio "+(bioI+1));bioI++}
   if(rev.length)S.plan[w][5].push({s:"rev",l:-1,done:false,label:"مراجعة الأسبوع: "+rev.join(" + ")+" (كروت + كويز + تسميع)"});
  }
  save();
 }
 return S.plan;
}
function planStats(){
 const p=planState();
 let done=0,total=0;
 for(const w of Object.values(p))for(const d of Object.values(w))for(const s of d){total++;if(s.done)done++}
 const jsDay=new Date().getDay();
 let wk=1;
 outer: for(let w=1;w<=PLAN_WEEKS;w++){for(const d of Object.values(p[w]))for(const s of d){if(!s.done){wk=w;break outer}}wk=PLAN_WEEKS}
 const today=(p[wk]&&p[wk][jsDay])?p[wk][jsDay].filter(s=>!s.done).length:0;
 return {done,total,pct:pct(done,total),week:wk,today};
}
function goPlan(){cur="plan";planWeek=planStats().week;planFormDay=null;render();window.scrollTo(0,0)}
window.goPlan=goPlan;
function setWeek(w){planWeek=w;planFormDay=null;render()}
window.setWeek=setWeek;
function planView(){
 const p=planState();
 const jsDay=new Date().getDay();
 const stats=planStats();
 let h=`<div class="card"><h3 style="margin-top:0">جدول المذاكرة · Study plan</h3>
  <p class="small" style="margin-top:0">خطة مقترحة: محاضرتين CT ومحاضرتين راديوبايولوجي في الأسبوع، والجمعة مراجعة. عدّلها زي ما يناسبك.</p>
  <div class="bar" style="margin:8px 0"><div style="width:${stats.pct}%"></div></div>
  <div class="pct">${stats.done}/${stats.total} sessions done</div></div>
  <div class="card" style="padding:12px"><div class="weekrow">`;
 for(let w=1;w<=PLAN_WEEKS;w++)h+=`<button class="${w===planWeek?'on':''}" onclick="setWeek(${w})">أسبوع ${w}</button>`;
 h+=`</div>`;
 const wp=p[planWeek];
 for(const [jsd,arName,enName] of DAYS){
  const list=wp[jsd]||[];
  const isToday=(planWeek===stats.week&&jsd===jsDay);
  h+=`<div class="daycol"><div class="dh"><b>${arName} · ${enName}</b>${isToday?'<span class="today">اليوم</span>':''}<button class="chk" style="background:#eef2ff;color:#3730a3;border:0;border-radius:8px;padding:5px 10px;font-weight:800;cursor:pointer" onclick="planForm(${jsd})">+ إضافة</button></div>`;
  if(planFormDay===jsd){
   h+=`<div class="addbox"><select id="pf-subj" onchange="planLecOpts()"><option value="ct">Basic CT Radiography</option><option value="bio">Radiobiology</option><option value="rev">مراجعة / Review</option></select>
    <select id="pf-lec"></select>
    <button class="btn" style="margin-top:6px;padding:10px" onclick="planAdd(${jsd})">أضف لليوم ده</button></div>`;
  }
  if(!list.length)h+=`<div class="small" style="margin:8px 0">مفيش جلسات - راحة 😌</div>`;
  list.forEach((s,i)=>{
   const label=s.s==="rev"?(s.label||"مراجعة"):(DATA[s.s].name+" - Lec "+(s.l+1)+": "+LECTURES[s.s][s.l]);
   const inApp=(s.s!=="rev"&&s.l===0);
   h+=`<div class="sess ${s.done?'done':''}"><div class="dot"></div><div class="si">${label}<small>${s.s==="rev"?"مراجعة أسبوعية":(inApp?"موجودة في التطبيق ✅":"قريباً في التطبيق")}</small></div>
    <button class="chk" onclick="planToggle(${jsd},${i})">${s.done?'✓':'تم'}</button>
    <button class="del" onclick="planDel(${jsd},${i})">حذف</button></div>`;
  });
  h+=`</div>`;
 }
 h+=`</div>`;
 return h;
}
function planForm(jsd){planFormDay=(planFormDay===jsd?null:jsd);render();if(planFormDay!==null)planLecOpts()}
window.planForm=planForm;
function planLecOpts(){
 const subj=document.getElementById("pf-subj").value;
 const sel=document.getElementById("pf-lec");
 let o="";
 if(subj==="rev")o=`<option value="-1">مراجعة عامة</option>`;

 sel.innerHTML=o;
}

function planAdd(jsd){

 const p=planState();
 p[planWeek][jsd].push(subj==="rev"?{s:"rev",l:-1,done:false,label:"مراجعة عامة"}:{s:subj,l:lec,done:false});

window.planAdd=planAdd;
function planToggle(jsd,i){const p=planState();p[planWeek][jsd][i].done=!p[planWeek][jsd][i].done;save();render()}
window.planToggle=planToggle;
function planDel(jsd,i){const p=planState();p[planWeek][jsd].splice(i,1);save();render()}
window.planDel=planDel;
